      - name: Create archive
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          version="${TAG#v}"
          safe_version="${version//\//-}"
          archive="${REPO}-v${safe_version}"

          find source -name .git -prune -exec rm -rf {} +
          mv source "$archive"
          tar -czf "${archive}.tar.gz" "$archive"

          echo "ARCHIVE=${archive}.tar.gz" >> "$GITHUB_ENV"
