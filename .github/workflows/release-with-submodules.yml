name: Add source with submodules

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. 6.8 or v6.8"
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Release tag: $TAG"
          test -n "$TAG"
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Checkout release with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
          path: source

      - name: Create archive
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          version="${TAG#v}"
          safe_version="${version//\//-}"
          archive="${REPO}-v${safe_version}"

          find source -name .git -prune -exec rm -rf {} +
          mv source "$archive"
          tar -czf "${archive}.tar.gz" "$archive"

          echo "ARCHIVE=${archive}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
